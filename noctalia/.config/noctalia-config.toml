[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/mitya/Pictures/silver-surfer.jpg"
font_family = "Noto Sans Oriya"
screen_time_enabled = true
settings_show_advanced = false

    [shell.launcher]
    fetch_exchange_rates = false
    pinned = [ "steam" ]

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_launcher = true
    transparency_mode = "glass"

[system.monitor]
cpu_temp_activity_threshold = 0
cpu_usage_activity_threshold = 0

[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]

[wallpaper]
directory = "/home/mitya/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/mitya/Pictures/Wallpapers/k.png"

    [wallpaper.last]
    path = "/home/mitya/Pictures/Wallpapers/k.png"

    [wallpaper.monitors.DP-2]
    path = "/home/mitya/Pictures/Wallpapers/k.png"

[widget.clock]
format = "{:%H:%M:%S}"
timezone = "Europe/Oslo"

[widget.media]
hide_when_no_media = true

[widget.notifications]
capsule = true

[widget.sysmon]
capsule = true
visualization = "graph"

[widget.tray]
capsule = true
