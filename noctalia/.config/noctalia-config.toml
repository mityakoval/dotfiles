[bar.default]
background_opacity = 0.69999998435378075
center = [ "active_window" ]
end = [ "sysmon", "tray", "network", "bluetooth", "volume", "clock", "control-center", "notifications", "session" ]
margin_ends = 0
start = [ "launcher", "workspaces", "media" ]
widget_spacing = 15

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 20

